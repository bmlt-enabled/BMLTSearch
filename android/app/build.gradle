apply plugin: 'com.android.application'

// The Maps SDK key, kept out of the repository.
//
// Resolution order: the GOOGLE_MAPS_KEY_ANDROID environment variable (how CI supplies
// it, from a repository secret), then googleMapsKeyAndroid in local.properties (how a
// developer supplies it locally — that file is gitignored). Falling back to an
// empty string means a checkout with no key still compiles and runs; only the
// map screen is blank, which is a far better failure than a build that cannot
// be reproduced without a secret.
def googleMapsKey = System.getenv('GOOGLE_MAPS_KEY_ANDROID') ?: ''
def localProperties = rootProject.file('local.properties')
if (!googleMapsKey && localProperties.exists()) {
    def props = new Properties()
    localProperties.withInputStream { props.load(it) }
    googleMapsKey = props.getProperty('googleMapsKeyAndroid', '')
}

// Release signing, supplied entirely from the environment.
//
// The keystore itself never enters the repository — CI decodes it from a secret
// into a temporary file and points ANDROID_KEYSTORE_PATH at it. When these are
// absent (any ordinary checkout) `signingConfigs.release` is simply not created
// and a release build comes out unsigned, which still compiles and still proves
// the project builds.
//
// This matters beyond signing: the Android Maps key is restricted to the package
// name *and* the signing certificate's SHA-1, so an APK signed with a different
// key gets a blank map. Keeping one keystore is what keeps that restriction
// usable. See PUBLIC_GOOGLE_MAPS_ANDROID_CERT_SHA1 in .env.example.
// Names are deliberately prefixed. Inside a `signingConfigs.release { }` block
// Groovy resolves bare `keyAlias` / `keyPassword` to the signing config's own
// properties rather than to variables declared out here, so unprefixed names
// silently read null and the build fails with "missing required property".
def signingStorePath = System.getenv('ANDROID_KEYSTORE_PATH')
def signingStorePassword = System.getenv('ANDROID_KEYSTORE_PASSWORD')
def signingKeyAlias = System.getenv('ANDROID_KEY_ALIAS') ?: 'upload'
def signingKeyPassword = System.getenv('ANDROID_KEY_PASSWORD') ?: signingStorePassword
def hasSigning = signingStorePath && file(signingStorePath).exists() && signingStorePassword

// Version, supplied by CI from the git tag that triggered the build.
//
// versionCode must be a monotonically increasing integer and Play permanently
// refuses a second upload carrying one it has already seen, so it comes from the
// workflow run number rather than from the tag: run numbers only ever go up,
// whereas a semver-derived code regresses the moment a patch release is tagged
// on an older branch. versionName is the tag itself, minus the leading "v".
//
// The fallbacks keep an ordinary local `./gradlew assembleRelease` working; they
// produce an APK that installs for testing but must never reach Play.
def versionCodeValue = (System.getenv('ANDROID_VERSION_CODE') ?: '1') as Integer
def versionNameValue = System.getenv('ANDROID_VERSION_NAME') ?: '0.0.0-dev'

android {
    namespace = "app.bmlt.search"
    compileSdk = rootProject.ext.compileSdkVersion

    if (hasSigning) {
        signingConfigs {
            release {
                storeFile file(signingStorePath)
                storePassword signingStorePassword
                keyAlias signingKeyAlias
                keyPassword signingKeyPassword
            }
        }
    }

    defaultConfig {
        applicationId "app.bmlt.search"
        minSdkVersion rootProject.ext.minSdkVersion
        targetSdkVersion rootProject.ext.targetSdkVersion
        versionCode versionCodeValue
        versionName versionNameValue
        testInstrumentationRunner "androidx.test.runner.AndroidJUnitRunner"
        manifestPlaceholders = [googleMapsKey: googleMapsKey]
        aaptOptions {
             // Files and dirs to omit from the packaged assets dir, modified to accommodate modern web apps.
             // Default: https://android.googlesource.com/platform/frameworks/base/+/282e181b58cf72b6ca770dc7ca5f91f135444502/tools/aapt/AaptAssets.cpp#61
            ignoreAssetsPattern = '!.svn:!.git:!.ds_store:!*.scc:.*:!CVS:!thumbs.db:!picasa.ini:!*~'
        }
    }
    buildTypes {
        release {
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android.txt'), 'proguard-rules.pro'
            if (hasSigning) {
                signingConfig signingConfigs.release
            }
        }
    }
}

repositories {
    flatDir{
        dirs '../capacitor-cordova-android-plugins/src/main/libs', 'libs'
    }
}

dependencies {
    implementation fileTree(include: ['*.jar'], dir: 'libs')
    implementation "androidx.appcompat:appcompat:$androidxAppCompatVersion"
    implementation "androidx.coordinatorlayout:coordinatorlayout:$androidxCoordinatorLayoutVersion"
    implementation "androidx.core:core-splashscreen:$coreSplashScreenVersion"
    implementation project(':capacitor-android')
    testImplementation "junit:junit:$junitVersion"
    androidTestImplementation "androidx.test.ext:junit:$androidxJunitVersion"
    androidTestImplementation "androidx.test.espresso:espresso-core:$androidxEspressoCoreVersion"
    implementation project(':capacitor-cordova-android-plugins')
}

apply from: 'capacitor.build.gradle'

try {
    def servicesJSON = file('google-services.json')
    if (servicesJSON.text) {
        apply plugin: 'com.google.gms.google-services'
    }
} catch(Exception e) {
    logger.info("google-services.json not found, google-services plugin not applied. Push Notifications won't work")
}
