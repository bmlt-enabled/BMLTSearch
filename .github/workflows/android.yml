name: Android build

# Manual or tag-triggered, matching the iOS workflow. Ubuntu runners are cheap
# (no 10x macOS multiplier), so this could run on every push — it does not,
# because a build worth installing should be a deliberate act, and `ci.yml`
# already proves the web bundle compiles on every push.
on:
  workflow_dispatch:
    inputs:
      upload:
        description: 'Upload the build to Play internal testing (uncheck to build only)'
        type: boolean
        default: true
  push:
    tags:
      - 'v*'

concurrency:
  group: android-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  build:
    name: Signed APK and AAB
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm

      # AGP 8.13 requires JDK 17+; 21 is the current LTS and what the project
      # builds against locally.
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '21'

      - uses: gradle/actions/setup-gradle@v6

      - name: Install dependencies
        run: npm ci

      # A tag push sets the shipped version; a manual run is a test build and is
      # deliberately stamped 0.0.0-dev so it cannot be mistaken for a release.
      # The APK/AAB filenames carry it too, since both artifacts otherwise look
      # identical in the downloads list.
      - name: Derive version
        id: version
        run: |
          set -euo pipefail
          if [ "$GITHUB_REF_TYPE" = "tag" ]; then
            NAME="${GITHUB_REF_NAME#v}"
          else
            NAME="0.0.0-dev"
          fi
          echo "name=$NAME" >> "$GITHUB_OUTPUT"
          # Offset because this build publishes to the *transferred* listing, whose
          # existing releases have already consumed codes in the 60000 range, and
          # Play permanently refuses a code it has already seen. A bare run number
          # — currently double digits — is rejected outright.
          #
          # Done in shell rather than in an Actions expression: those have no
          # arithmetic operators, and an invalid expression fails the whole file
          # to parse, so every trigger dies at startup with no job and no log.
          # Note an expression is interpolated inside a run block even within a
          # shell comment, so one cannot be quoted in prose here either — writing
          # the broken form into this comment is what failed the file the first
          # time it was fixed.
          CODE=$(( 100000 + GITHUB_RUN_NUMBER ))
          echo "code=$CODE" >> "$GITHUB_OUTPUT"
          echo "Version $NAME (code $CODE)" >> "$GITHUB_STEP_SUMMARY"
          # Recorded here because `secrets` is not available in a step-level
          # `if`. A fork without the secret builds and uploads artifacts as
          # normal; it just does not publish.
          echo "publish=${{ secrets.PLAY_SERVICE_ACCOUNT_JSON != '' }}" >> "$GITHUB_OUTPUT"

      # The Maps keys are inlined into the web bundle at build time. All three
      # are passed even when empty; an unset key degrades to an empty string.
      - name: Build web bundle
        env:
          PUBLIC_GOOGLE_MAPS_KEY_WEB: ${{ secrets.GOOGLE_MAPS_KEY_WEB }}
          PUBLIC_GOOGLE_MAPS_KEY_IOS: ${{ secrets.GOOGLE_MAPS_KEY_IOS }}
          PUBLIC_GOOGLE_MAPS_KEY_ANDROID: ${{ secrets.GOOGLE_MAPS_KEY_ANDROID }}
          PUBLIC_GOOGLE_MAPS_ANDROID_CERT_SHA1: ${{ secrets.GOOGLE_MAPS_ANDROID_CERT_SHA1 }}
        run: npm run build

      - name: Sync Capacitor Android
        run: npx cap sync android

      # Written outside the workspace so it cannot be picked up by a later step
      # or swept into an artifact, and deleted in an always() step at the end.
      - name: Decode keystore
        env:
          KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          set -euo pipefail
          if [ -z "$KEYSTORE_BASE64" ]; then
            echo "::error::ANDROID_KEYSTORE_BASE64 is not set — the APK would be unsigned and uninstallable."
            exit 1
          fi
          echo -n "$KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/upload-keystore.jks"

      # Two artifacts on purpose: the APK is what you sideload to test, the AAB
      # is the only format Play accepts for a new app.
      #
      # GOOGLE_MAPS_KEY_ANDROID is passed to Gradle separately from the web
      # bundle's keys because the Maps SDK for Android reads its key from the
      # merged manifest, not from the apiKey handed to GoogleMap.create(). That
      # key is restricted to this package *and* this keystore's SHA-1, so
      # anything signed with a different key shows a blank map — which is why the
      # AAB needs care: see the Play App Signing note in the README.
      - name: Assemble release APK and AAB
        env:
          ANDROID_KEYSTORE_PATH: ${{ runner.temp }}/upload-keystore.jks
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
          GOOGLE_MAPS_KEY_ANDROID: ${{ secrets.GOOGLE_MAPS_KEY_ANDROID }}
          ANDROID_VERSION_CODE: ${{ steps.version.outputs.code }}
          ANDROID_VERSION_NAME: ${{ steps.version.outputs.name }}
        working-directory: android
        run: ./gradlew assembleRelease bundleRelease --no-daemon

      # An unsigned APK still builds and would upload happily, then fail to
      # install with no useful message. Fail here instead, and record which
      # certificate signed it so a blank map can be traced back to a SHA-1 that
      # is not on the Maps key.
      - name: Verify signature
        run: |
          set -euo pipefail
          APK=$(find android/app/build/outputs/apk/release -name '*.apk' | head -1)
          test -n "$APK" || { echo "::error::No APK produced"; exit 1; }
          APKSIGNER=$(find "$ANDROID_HOME/build-tools" -name apksigner | sort -V | tail -1)
          "$APKSIGNER" verify --print-certs "$APK"

      - uses: actions/upload-artifact@v7
        with:
          name: bmlt-search-${{ steps.version.outputs.name }}-${{ github.run_number }}
          path: |
            android/app/build/outputs/apk/release/*.apk
            android/app/build/outputs/bundle/release/*.aab
          if-no-files-found: error
          retention-days: 14

      # A tag always publishes; a manual run publishes unless the box is
      # unticked. Same shape as the iOS workflow's TestFlight step, deliberately
      # — the two stores differ in plenty of ways, but "how do I get a build to
      # my testers" should not be one of them.
      #
      # A manual build is stamped 0.0.0-dev, which is what appears in the Play
      # release list. That is the intended tell: only a tag produces a version
      # number anyone should quote. Note Play permanently refuses a versionCode
      # it has already accepted, and versionCode comes from the run number, so
      # every publish consumes one whether or not it was tagged.
      #
      # The artifact upload above runs first on purpose — if Play rejects the
      # release, the AAB and APK are still downloadable from the run rather than
      # having to be rebuilt.
      #
      # Google re-signs this with the Play app signing key, so what users install
      # does NOT carry the upload keystore's certificate. That key's SHA-1 must
      # be registered on the Android Maps key or the map is blank for everyone
      # who installs from Play. Find it under Play Console → Protected with Play
      # (it used to live under App integrity, which now just redirects), or read
      # it off a downloaded universal APK with
      # `apksigner verify --print-certs` — keytool -jarfile will not see it,
      # since Play signs v2/v3 rather than v1.
      - name: Upload to Play internal testing
        if: (github.event_name == 'push' || inputs.upload) && steps.version.outputs.publish == 'true'
        uses: r0adkll/upload-google-play@v1
        with:
          serviceAccountJsonPlainText: ${{ secrets.PLAY_SERVICE_ACCOUNT_JSON }}
          packageName: ie.nasouth.bmltsearch
          releaseFiles: android/app/build/outputs/bundle/release/*.aab
          releaseName: ${{ steps.version.outputs.name }} (${{ github.run_number }})
          tracks: internal
          status: completed

      - name: Clean up keystore
        if: always()
        run: rm -f "$RUNNER_TEMP/upload-keystore.jks"
