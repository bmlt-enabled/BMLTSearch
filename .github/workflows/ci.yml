name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

# The deploy job publishes to Pages; the token needs to be able to write it.
permissions:
  contents: read
  pages: write
  id-token: write

# A newer push supersedes an in-flight run, except on main, where a cancelled
# deploy could leave Pages serving a half-published build.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

jobs:
  verify:
    name: Lint, types, tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - run: npm run lint

      - run: npm run check

      - run: npm test

      # Built here too, so a PR that type-checks but cannot build still fails.
      # The key is absent on pull_request from a fork; the build tolerates an
      # empty value and only the map screen is affected.
      - name: Build
        env:
          PUBLIC_GOOGLE_MAPS_KEY: ${{ secrets.GOOGLE_MAPS_KEY }}
        run: npm run build

  deploy:
    name: Deploy to GitHub Pages
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    needs: verify
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      # Rebuilt rather than carried over as an artifact from `verify`: that job
      # runs on pull requests too, where the secret is unavailable, so its output
      # is not necessarily a deployable build.
      - name: Build
        env:
          PUBLIC_GOOGLE_MAPS_KEY: ${{ secrets.GOOGLE_MAPS_KEY }}
        run: npm run build

      - uses: actions/configure-pages@v5

      - uses: actions/upload-pages-artifact@v4
        with:
          path: build

      - id: deployment
        uses: actions/deploy-pages@v4
