name: Bug Report
description: Something isn't working correctly
labels: [bug]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for taking the time to report a bug. Please fill out as much as you can — it helps us fix things faster.

        **Wrong meeting data** (times, addresses, missing meetings) is not an app bug — that comes from the root servers. See the link on the previous page.

  - type: textarea
    id: description
    attributes:
      label: What happened?
      description: A clear description of the bug.
      placeholder: When I do X, Y happens instead of Z.
    validations:
      required: true

  - type: textarea
    id: reproduce
    attributes:
      label: Steps to reproduce
      placeholder: |
        1. Open the app / search for ...
        2. Tap on ...
        3. See error
    validations:
      required: true

  - type: textarea
    id: expected
    attributes:
      label: Expected behavior
      placeholder: What should have happened?
    validations:
      required: true

  - type: dropdown
    id: platform
    attributes:
      label: Platform
      options:
        - Web (app.bmlt.app)
        - iOS
        - Android
        - Multiple / not sure
    validations:
      required: true

  - type: input
    id: version
    attributes:
      label: App version
      description: The version shown in the app's about/settings, or the TestFlight/build number.
      placeholder: e.g. 1.2.0 (build 22)

  - type: input
    id: device
    attributes:
      label: Device / OS / browser
      placeholder: e.g. iPhone 15 on iOS 26, or Chrome 125 on macOS 14
    validations:
      required: true

  - type: input
    id: root-server
    attributes:
      label: Root server (if relevant)
      description: If the bug involves a specific search, which BMLT server or area were you searching?
      placeholder: e.g. aggregator, or a specific region

  - type: textarea
    id: extra
    attributes:
      label: Anything else?
      description: Screenshots, console errors, links to a live page, etc.
