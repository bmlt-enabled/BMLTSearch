name: Translation Fix
description: Report or correct a translation in the app
labels: [translation]
body:
  - type: markdown
    attributes:
      value: |
        Most non-English strings were generated by an LLM and have not been reviewed by native speakers. Corrections from fluent speakers are very welcome — thank you for taking the time.

        If you'd rather send a PR directly, see the **Translations** section in [CONTRIBUTING.md](https://github.com/bmlt-enabled/BMLTSearch/blob/main/.github/CONTRIBUTING.md#translations) — it's a one-file edit in `src/lib/i18n/locales/{code}.json`.

  - type: input
    id: language
    attributes:
      label: Language
      description: Language name and code (e.g. "Español (es)", "فارسی (fa)").
    validations:
      required: true

  - type: textarea
    id: current
    attributes:
      label: Current text
      description: Paste the string as it currently appears, plus the JSON key or a screenshot if helpful.
      placeholder: |
        Key: search.noResults
        Current: "No se encontraron reuniones"
    validations:
      required: true

  - type: textarea
    id: suggested
    attributes:
      label: Suggested correction
      description: What should it say instead?
    validations:
      required: true

  - type: textarea
    id: rationale
    attributes:
      label: Why is the current translation wrong?
      description: Grammar, regional preference, awkward phrasing, NA recovery context, etc.

  - type: checkboxes
    id: native
    attributes:
      label: Native / fluent speaker?
      options:
        - label: I speak this language natively or fluently
